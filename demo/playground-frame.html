<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Playground preview</title>
  <link rel="stylesheet" href="css/parallelogram-dashboard.css">
  <link rel="stylesheet" href="css/demo.css">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background-color: var(--bg);
      color: var(--fg);
    }

    body.pg-checker {
      background-image:
        linear-gradient(45deg, var(--bg-muted) 25%, transparent 25%),
        linear-gradient(-45deg, var(--bg-muted) 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, var(--bg-muted) 75%),
        linear-gradient(-45deg, transparent 75%, var(--bg-muted) 75%);
      background-size: 20px 20px;
      background-position: 0 0, 0 10px, 10px -10px, -10px 0;
    }

    .pg-stage {
      box-sizing: border-box;
      min-height: 100vh;
      padding: 2rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .pg-stage--block {
      display: block;
    }

    .pg-stage--block > :not(.pg-matrix, dialog) {
      max-width: 40rem;
      margin-inline: auto;
    }

    .pg-stage--block > .card__grid {
      max-width: none;
    }

    .pg-matrix {
      border-collapse: separate;
      border-spacing: 1.5rem 1rem;
    }

    .pg-matrix th {
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--fg-muted);
      text-align: left;
      white-space: nowrap;
    }

    .pg-matrix td {
      vertical-align: middle;
      min-width: 8rem;
    }

    .pg-stage--block .pg-matrix td {
      min-width: 16rem;
    }

    /* Page-level layouts fill the frame with no padding */
    .pg-stage--full {
      display: block;
      padding: 0;
    }

    .pg-stage--full:has(> .pg-matrix) {
      padding: 1.5rem;
    }

    /* Each cell is its own small viewport: fixed children stay inside it, and
       viewport-height layouts fill the cell rather than the frame */
    .pg-stage--full .pg-cell__preview {
      position: relative;
      contain: layout paint;
      width: 64rem;
      height: 28rem;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 0.375rem;
    }

    .pg-stage--full .pg-cell__preview :is(.dashboard, .sidebarlayout) {
      min-height: 100%;
    }

    .pg-cell {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 0.5rem;
    }

    .pg-stage--block .pg-cell {
      align-items: stretch;
    }

    .pg-class {
      display: inline-flex;
      align-items: center;
      gap: 0.375rem;
      max-width: 100%;
      padding: 0.125rem 0.375rem;
      border: 1px solid var(--border);
      border-radius: 0.25rem;
      background-color: var(--bg-muted);
      color: var(--fg-muted);
      font-size: 0.6875rem;
      cursor: copy;
    }

    .pg-class:hover {
      color: var(--fg);
      border-color: var(--fg-muted);
    }

    .pg-class code {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      background: none;
      padding: 0;
    }

    .pg-class .icon {
      flex-shrink: 0;
      width: 0.75rem;
      height: 0.75rem;
    }
  </style>
</head>
<body data-demonav="off">
  <main id="root" class="pg-stage"></main>
  <script type="importmap">
  {
    "imports": {
      "@parallelogram-js/dashboard": "./vendor/parallelogram-dashboard/index.js",
      "@parallelogram-js/core/": "./vendor/parallelogram-js/"
    }
  }
  </script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
