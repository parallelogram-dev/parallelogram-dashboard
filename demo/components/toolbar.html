<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Toolbar - Parallelogram Dashboard</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect fill='%236366f1' x='10' y='20' width='80' height='60' rx='4' transform='skewX(-10)'/></svg>">
  <script>try { var theme = localStorage.getItem('pd-theme'); if (theme === 'dark' || theme === 'light') document.documentElement.setAttribute('data-theme', theme); } catch (e) {}</script>
  <link rel="stylesheet" href="../css/parallelogram-dashboard.css">
  <link rel="stylesheet" href="../css/demo.css">
  <link rel="stylesheet" href="../css/docs.css">
</head>
<body data-component="toolbar">
  <div class="docs">
    <header class="docs__header">
      <a href="../index.html" class="docs__brand">Parallelogram <span class="text--muted">Dashboard</span></a>
      <button type="button" class="btn btn--outline btn--sm" data-theme-toggle>Dark mode</button>
    </header>

    <nav class="docs__nav" aria-label="Components" data-component-nav></nav>

    <main class="docs__main">
      <div class="docs__intro">
        <p class="docs__eyebrow">Forms</p>
        <h1 class="docs__title">Toolbar</h1>
        <p class="docs__lead">Search input with filters and actions.</p>
      </div>

      <section class="docs__section" aria-labelledby="playground-heading">
        <h2 id="playground-heading" class="docs__h2">Playground</h2>
        <div data-playground></div>
      </section>

      <section class="docs__section" aria-labelledby="examples-heading">
        <h2 id="examples-heading" class="docs__h2">Examples</h2>
          <div class="demo-label">Default</div>
          <div class="toolbar spacer--lg">
            <div class="toolbar__group">
              <svg class="icon toolbar__icon" viewBox="0 0 24 24"><path d="M10 10m-7 0a7 7 0 1 0 14 0a7 7 0 1 0 -14 0"/><path d="M21 21l-6 -6"/></svg>
              <input type="text" class="toolbar__input" placeholder="Search...">
            </div>
            <div class="toolbar__filters">
              <select class="select select--auto">
                <option>All Categories</option>
                <option>Products</option>
                <option>Orders</option>
              </select>
            </div>
            <div class="toolbar__actions">
              <button class="btn btn--primary">Search</button>
            </div>
          </div>

          <div class="demo-label">Filter Chips</div>
          <div class="activefilters">
            <span class="activefilters__label">Filters:</span>
            <span class="filter__label filter__label--active">
              Status: Active
              <button type="button" class="filter__remove" aria-label="Remove filter Status: Active">
                <svg class="icon icon--sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6l-12 12"/><path d="M6 6l12 12"/></svg>
              </button>
            </span>
            <span class="filter__label filter__label--active">
              Category: Electronics
              <button type="button" class="filter__remove" aria-label="Remove filter Category: Electronics">
                <svg class="icon icon--sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6l-12 12"/><path d="M6 6l12 12"/></svg>
              </button>
            </span>
            <button type="button" class="activefilters__clear">Clear all</button>
          </div>
      </section>

      <nav class="docs__pager" aria-label="Previous and next component" data-pager></nav>
    </main>
  </div>

  <script type="module" src="../js/main.js"></script>
  <script type="module" src="../js/components/page.js"></script>
</body>
</html>
