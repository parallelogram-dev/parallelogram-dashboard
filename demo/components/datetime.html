<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Datetime Picker - Parallelogram Dashboard</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect fill='%236366f1' x='10' y='20' width='80' height='60' rx='4' transform='skewX(-10)'/></svg>">
  <script>try { if (localStorage.getItem('pd-theme') === 'dark') document.documentElement.setAttribute('data-theme', 'dark'); } catch (e) {}</script>
  <link rel="stylesheet" href="../css/parallelogram-dashboard.css">
  <link rel="stylesheet" href="../css/docs.css">
</head>
<body data-component="datetime">
  <div class="docs">
    <header class="docs__header">
      <a href="../index.html" class="docs__brand">Parallelogram <span class="text--muted">Dashboard</span></a>
      <button type="button" class="btn btn--outline btn--sm" data-theme-toggle>Dark mode</button>
    </header>

    <nav class="docs__nav" aria-label="Components" data-component-nav></nav>

    <main class="docs__main">
      <div class="docs__intro">
        <p class="docs__eyebrow">Forms</p>
        <h1 class="docs__title">Datetime Picker</h1>
        <p class="docs__lead">Date and time selection using the &lt;p-datetime&gt; web component from parallelogram-js.</p>
      </div>

      <section class="docs__section" aria-labelledby="examples-heading">
        <h2 id="examples-heading" class="docs__h2">Examples</h2>
          <div class="demo-stack demo-stack--lg-gap constrain--sm">
            <div class="form__field">
              <label class="form__label">Date Picker</label>
              <p-datetime name="date" mode="date" class="input form__control"></p-datetime>
            </div>

            <div class="form__field">
              <label class="form__label">Datetime Picker</label>
              <p-datetime name="datetime" mode="datetime" class="input form__control"></p-datetime>
            </div>

            <div class="form__field">
              <label class="form__label">Time Picker (12-hour)</label>
              <p-datetime name="time" mode="time" time-format="12" class="input form__control"></p-datetime>
            </div>

            <div class="form__field">
              <label class="form__label">With Quick Dates</label>
              <p-datetime name="quick" mode="date" show-quick-dates class="input form__control"></p-datetime>
            </div>

            <div class="form__field">
              <label class="form__label">Date Range</label>
              <p-datetime name="rangeStart" mode="date" range range-to="rangeEnd" class="input form__control"></p-datetime>
            </div>
          </div>
      </section>

      <nav class="docs__pager" aria-label="Previous and next component" data-pager></nav>
    </main>
  </div>

  <script type="module" src="../js/main.js"></script>
  <script type="module" src="../js/components/page.js"></script>
</body>
</html>
