<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Badge - Parallelogram Dashboard</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect fill='%236366f1' x='10' y='20' width='80' height='60' rx='4' transform='skewX(-10)'/></svg>">
  <script>try { var theme = localStorage.getItem('pd-theme'); if (theme === 'dark' || theme === 'light') document.documentElement.setAttribute('data-theme', theme); } catch (e) {}</script>
  <link rel="stylesheet" href="../css/parallelogram-dashboard.css">
  <link rel="stylesheet" href="../css/demo.css">
  <link rel="stylesheet" href="../css/docs.css">
</head>
<body data-component="badge">
  <div class="docs">
    <header class="docs__header">
      <a href="../index.html" class="docs__brand">Parallelogram <span class="text--muted">Dashboard</span></a>
      <button type="button" class="btn btn--outline btn--sm" data-theme-toggle>Dark mode</button>
    </header>

    <nav class="docs__nav" aria-label="Components" data-component-nav></nav>

    <main class="docs__main">
      <div class="docs__intro">
        <p class="docs__eyebrow">Data display</p>
        <h1 class="docs__title">Badge</h1>
        <p class="docs__lead">Small status labels, counts and removable tags.</p>
      </div>

        <section class="docs__section" aria-labelledby="playground-heading">
          <h2 id="playground-heading" class="docs__h2">Playground</h2>
          <div data-playground></div>
        </section>

      <section class="docs__section" aria-labelledby="examples-heading">
        <h2 id="examples-heading" class="docs__h2">Examples</h2>
          <div class="demo-label">Variants</div>
          <div class="demo-row spacer--lg">
            <span class="badge badge--primary">Primary</span>
            <span class="badge badge--secondary">Secondary</span>
            <span class="badge badge--outline">Outline</span>
            <span class="badge badge--destructive">Destructive</span>
            <span class="badge badge--success">Success</span>
            <span class="badge badge--warning">Warning</span>
            <span class="badge badge--info">Info</span>
          </div>

          <div class="demo-label">Muted Variants</div>
          <div class="demo-row spacer--lg">
            <span class="badge badge--destructive-muted">Error</span>
            <span class="badge badge--success-muted">Success</span>
            <span class="badge badge--warning-muted">Warning</span>
            <span class="badge badge--info-muted">Info</span>
          </div>

          <div class="demo-label">Sizes & Shapes</div>
          <div class="demo-row">
            <span class="badge badge--primary badge--sm">Small</span>
            <span class="badge badge--primary">Default</span>
            <span class="badge badge--primary badge--lg">Large</span>
            <span class="badge badge--primary badge--pill">Pill Shape</span>
            <span class="badge badge--success badge--dot"></span>
          </div>
      </section>

      <nav class="docs__pager" aria-label="Previous and next component" data-pager></nav>
    </main>
  </div>

  <script type="module" src="../js/main.js"></script>
  <script type="module" src="../js/components/page.js"></script>
</body>
</html>
