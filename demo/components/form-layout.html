<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form Layout - Parallelogram Dashboard</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect fill='%236366f1' x='10' y='20' width='80' height='60' rx='4' transform='skewX(-10)'/></svg>">
  <script>try { if (localStorage.getItem('pd-theme') === 'dark') document.documentElement.setAttribute('data-theme', 'dark'); } catch (e) {}</script>
  <link rel="stylesheet" href="../css/parallelogram-dashboard.css">
  <link rel="stylesheet" href="../css/docs.css">
</head>
<body data-component="form-layout">
  <div class="docs">
    <header class="docs__header">
      <a href="../index.html" class="docs__brand">Parallelogram <span class="text--muted">Dashboard</span></a>
      <button type="button" class="btn btn--outline btn--sm" data-theme-toggle>Dark mode</button>
    </header>

    <nav class="docs__nav" aria-label="Components" data-component-nav></nav>

    <main class="docs__main">
      <div class="docs__intro">
        <p class="docs__eyebrow">Forms</p>
        <h1 class="docs__title">Form Layout</h1>
        <p class="docs__lead">Form sections, rows, and enhanced fields.</p>
      </div>

      <section class="docs__section" aria-labelledby="examples-heading">
        <h2 id="examples-heading" class="docs__h2">Examples</h2>
          <div class="constrain constrain--md">
            <div class="demo-label">Form Field with Counter</div>
            <div class="formfield spacer--lg">
              <label class="formfield__label">
                Description
                <span class="formfield__required">*</span>
              </label>
              <textarea class="textarea" placeholder="Enter description..." maxlength="200">This is an example description text.</textarea>
              <div class="formfield__counter">35 / 200</div>
            </div>

            <div class="demo-label">Form Field with Error</div>
            <div class="formfield spacer--lg">
              <label class="formfield__label" for="demo-email-error">Email Address</label>
              <input type="email" id="demo-email-error" class="input" value="invalid-email" aria-invalid="true" aria-describedby="demo-email-error-message">
              <p class="formfield__error" id="demo-email-error-message">Please enter a valid email address.</p>
            </div>

            <div class="demo-label">Input Group with Addon</div>
            <div class="inputgroup spacer--lg">
              <span class="inputgroup__addon">https://</span>
              <input type="text" class="input" placeholder="example.com">
            </div>

            <div class="demo-label">Input Group with Button</div>
            <div class="inputgroup spacer--lg">
              <input type="email" class="input" placeholder="Enter email">
              <button class="btn btn--primary">Subscribe</button>
            </div>

            <div class="demo-label">Fieldset</div>
            <fieldset class="fieldset">
              <legend class="fieldset__legend">Contact Information</legend>
              <div class="fieldset__content">
                <div class="form__row form__row--2">
                  <div class="form__group">
                    <label class="form__group-label">First Name</label>
                    <input type="text" class="input" placeholder="John">
                  </div>
                  <div class="form__group">
                    <label class="form__group-label">Last Name</label>
                    <input type="text" class="input" placeholder="Doe">
                  </div>
                </div>
                <div class="form__group">
                  <label class="form__group-label">Email</label>
                  <input type="email" class="input" placeholder="john@example.com">
                </div>
              </div>
            </fieldset>
          </div>
      </section>

      <nav class="docs__pager" aria-label="Previous and next component" data-pager></nav>
    </main>
  </div>

  <script type="module" src="../js/main.js"></script>
  <script type="module" src="../js/components/page.js"></script>
</body>
</html>
