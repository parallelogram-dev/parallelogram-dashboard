<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Empty State - Parallelogram Dashboard</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect fill='%236366f1' x='10' y='20' width='80' height='60' rx='4' transform='skewX(-10)'/></svg>">
  <script>try { if (localStorage.getItem('pd-theme') === 'dark') document.documentElement.setAttribute('data-theme', 'dark'); } catch (e) {}</script>
  <link rel="stylesheet" href="../css/parallelogram-dashboard.css">
  <link rel="stylesheet" href="../css/docs.css">
</head>
<body data-component="empty">
  <div class="docs">
    <header class="docs__header">
      <a href="../index.html" class="docs__brand">Parallelogram <span class="text--muted">Dashboard</span></a>
      <button type="button" class="btn btn--outline btn--sm" data-theme-toggle>Dark mode</button>
    </header>

    <nav class="docs__nav" aria-label="Components" data-component-nav></nav>

    <main class="docs__main">
      <div class="docs__intro">
        <p class="docs__eyebrow">Data display</p>
        <h1 class="docs__title">Empty State</h1>
        <p class="docs__lead">Placeholder content for empty views.</p>
      </div>

      <section class="docs__section" aria-labelledby="playground-heading">
        <h2 id="playground-heading" class="docs__h2">Playground</h2>
        <div data-playground></div>
      </section>

      <section class="docs__section" aria-labelledby="examples-heading">
        <h2 id="examples-heading" class="docs__h2">Examples</h2>
          <div class="demo-stack demo-stack--lg-gap constrain--lg">
            <div class="demo-box">
              <div class="empty">
                <div class="empty__icon">
                  <svg class="icon icon--xl" viewBox="0 0 24 24"><path d="M5 4h4l3 3h7a2 2 0 0 1 2 2v8a2 2 0 0 1 -2 2h-14a2 2 0 0 1 -2 -2v-11a2 2 0 0 1 2 -2"/></svg>
                </div>
                <h3 class="empty__title">No files found</h3>
                <p class="empty__description">Get started by uploading your first file or creating a new folder.</p>
                <div class="empty__actions">
                  <button class="btn btn--primary">
                    <svg class="icon btn__icon" viewBox="0 0 24 24"><path d="M12 5l0 14"/><path d="M5 12l14 0"/></svg>
                    Upload File
                  </button>
                  <button class="btn btn--outline">Create Folder</button>
                </div>
              </div>
            </div>

            <div class="demo-box">
              <div class="empty empty--search empty--sm">
                <div class="empty__icon">
                  <svg class="icon icon--lg" viewBox="0 0 24 24"><path d="M10 10m-7 0a7 7 0 1 0 14 0a7 7 0 1 0 -14 0"/><path d="M21 21l-6 -6"/></svg>
                </div>
                <h3 class="empty__title">No results found</h3>
                <p class="empty__description">Try adjusting your search or filter to find what you're looking for.</p>
                <div class="empty__actions">
                  <button class="btn btn--outline btn--sm">Clear Filters</button>
                </div>
              </div>
            </div>
          </div>
      </section>

      <nav class="docs__pager" aria-label="Previous and next component" data-pager></nav>
    </main>
  </div>

  <script type="module" src="../js/main.js"></script>
  <script type="module" src="../js/components/page.js"></script>
</body>
</html>
