<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modal - Parallelogram Dashboard</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect fill='%236366f1' x='10' y='20' width='80' height='60' rx='4' transform='skewX(-10)'/></svg>">
  <script>try { var theme = localStorage.getItem('pd-theme'); if (theme === 'dark' || theme === 'light') document.documentElement.setAttribute('data-theme', theme); } catch (e) {}</script>
  <link rel="stylesheet" href="../css/parallelogram-dashboard.css">
  <link rel="stylesheet" href="../css/demo.css">
  <link rel="stylesheet" href="../css/docs.css">
</head>
<body data-component="modal">
  <div class="docs">
    <header class="docs__header">
      <a href="../index.html" class="docs__brand">Parallelogram <span class="text--muted">Dashboard</span></a>
      <button type="button" class="btn btn--outline btn--sm" data-theme-toggle>Dark mode</button>
    </header>

    <nav class="docs__nav" aria-label="Components" data-component-nav></nav>

    <main class="docs__main">
      <div class="docs__intro">
        <p class="docs__eyebrow">Overlays</p>
        <h1 class="docs__title">Modal</h1>
        <p class="docs__lead">Dialog overlays for focused interactions, using the &lt;p-modal&gt; web component from parallelogram-js.</p>
      </div>

      <section class="docs__section" aria-labelledby="playground-heading">
        <h2 id="playground-heading" class="docs__h2">Playground</h2>
        <div data-playground></div>
      </section>

      <section class="docs__section" aria-labelledby="examples-heading">
        <h2 id="examples-heading" class="docs__h2">Examples</h2>
          <div class="demo-label">Interactive Modal (p-modal)</div>
          <div class="demo-box">
            <button class="btn btn--primary" data-modal data-modal-target="#demo-modal">Open Modal</button>
          </div>

          <p-modal id="demo-modal" data-modal-size="md">
            <h2 slot="title">Edit Profile</h2>
            <div class="form__field">
              <label class="form__label">Name</label>
              <input type="text" class="input form__control" value="John Doe">
            </div>
            <div class="form__field spacer--md">
              <label class="form__label">Email</label>
              <input type="email" class="input form__control" value="john@example.com">
            </div>
            <div slot="actions">
              <button class="btn btn--secondary" data-modal-close>Cancel</button>
              <button class="btn btn--primary">Save Changes</button>
            </div>
          </p-modal>

          <div class="demo-label">Static Preview (CSS fallback)</div>
          <div class="demo-box constrain--md">
            <div class="modal__dialog demo-preview--modal">
              <div class="modal__header">
                <div>
                  <h3 class="modal__title">Edit Profile</h3>
                  <p class="modal__description">Make changes to your profile here.</p>
                </div>
                <button class="modal__close">
                  <svg class="icon" viewBox="0 0 24 24"><path d="M18 6l-12 12"/><path d="M6 6l12 12"/></svg>
                </button>
              </div>
              <div class="modal__content">
                <div class="form__field">
                  <label class="form__label">Name</label>
                  <input type="text" class="input form__control" value="John Doe">
                </div>
                <div class="form__field spacer--md">
                  <label class="form__label">Email</label>
                  <input type="email" class="input form__control" value="john@example.com">
                </div>
              </div>
              <div class="modal__footer">
                <button class="btn btn--outline">Cancel</button>
                <button class="btn btn--primary">Save Changes</button>
              </div>
            </div>
          </div>
      </section>

      <nav class="docs__pager" aria-label="Previous and next component" data-pager></nav>
    </main>
  </div>

  <script type="importmap">
  {
    "imports": {
      "@parallelogram-js/dashboard": "../vendor/parallelogram-dashboard/index.js",
      "@parallelogram-js/core/": "../vendor/parallelogram-js/"
    }
  }
  </script>
  <script type="module" src="../js/main.js"></script>
  <script type="module" src="../js/components/page.js"></script>
</body>
</html>
