<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tooltip - Parallelogram Dashboard</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect fill='%236366f1' x='10' y='20' width='80' height='60' rx='4' transform='skewX(-10)'/></svg>">
  <script>try { if (localStorage.getItem('pd-theme') === 'dark') document.documentElement.setAttribute('data-theme', 'dark'); } catch (e) {}</script>
  <link rel="stylesheet" href="../css/parallelogram-dashboard.css">
  <link rel="stylesheet" href="../css/docs.css">
</head>
<body data-component="tooltip">
  <div class="docs">
    <header class="docs__header">
      <a href="../index.html" class="docs__brand">Parallelogram <span class="text--muted">Dashboard</span></a>
      <button type="button" class="btn btn--outline btn--sm" data-theme-toggle>Dark mode</button>
    </header>

    <nav class="docs__nav" aria-label="Components" data-component-nav></nav>

    <main class="docs__main">
      <div class="docs__intro">
        <p class="docs__eyebrow">Feedback</p>
        <h1 class="docs__title">Tooltip</h1>
        <p class="docs__lead">Hover hints and contextual information.</p>
      </div>

      <section class="docs__section" aria-labelledby="playground-heading">
        <h2 id="playground-heading" class="docs__h2">Playground</h2>
        <div data-playground></div>
      </section>

      <section class="docs__section" aria-labelledby="examples-heading">
        <h2 id="examples-heading" class="docs__h2">Examples</h2>
          <div class="demo-label">Positions</div>
          <div class="demo-row demo-row--2xl demo-row--p-xl spacer--xl">
            <span class="tooltip">
              <button class="btn btn--outline">Top</button>
              <span class="tooltip__content">Tooltip on top</span>
            </span>

            <span class="tooltip">
              <button class="btn btn--outline">Bottom</button>
              <span class="tooltip__content tooltip__content--bottom">Tooltip on bottom</span>
            </span>

            <span class="tooltip">
              <button class="btn btn--outline">Left</button>
              <span class="tooltip__content tooltip__content--left">Tooltip on left</span>
            </span>

            <span class="tooltip">
              <button class="btn btn--outline">Right</button>
              <span class="tooltip__content tooltip__content--right">Tooltip on right</span>
            </span>
          </div>

          <div class="demo-label">Data Attribute Tooltip</div>
          <div class="demo-row demo-row--lg demo-row--p-xl">
            <button class="btn btn--ghost btn--icon" data-tooltip="Edit item">
              <svg class="icon" viewBox="0 0 24 24"><path d="M7 7h-1a2 2 0 0 0 -2 2v9a2 2 0 0 0 2 2h9a2 2 0 0 0 2 -2v-1"/><path d="M20.385 6.585a2.1 2.1 0 0 0 -2.97 -2.97l-8.415 8.385v3h3l8.385 -8.415z"/><path d="M16 5l3 3"/></svg>
            </button>
            <button class="btn btn--ghost btn--icon" data-tooltip="Delete item">
              <svg class="icon" viewBox="0 0 24 24"><path d="M4 7l16 0"/><path d="M10 11l0 6"/><path d="M14 11l0 6"/><path d="M5 7l1 12a2 2 0 0 0 2 2h8a2 2 0 0 0 2 -2l1 -12"/><path d="M9 7v-3a1 1 0 0 1 1 -1h4a1 1 0 0 1 1 1v3"/></svg>
            </button>
            <button class="btn btn--ghost btn--icon" data-tooltip="Share item" data-tooltip-position="bottom">
              <svg class="icon" viewBox="0 0 24 24"><path d="M6 12m-3 0a3 3 0 1 0 6 0a3 3 0 1 0 -6 0"/><path d="M18 6m-3 0a3 3 0 1 0 6 0a3 3 0 1 0 -6 0"/><path d="M18 18m-3 0a3 3 0 1 0 6 0a3 3 0 1 0 -6 0"/><path d="M8.7 10.7l6.6 -3.4"/><path d="M8.7 13.3l6.6 3.4"/></svg>
            </button>
          </div>

          <div class="demo-label demo-label--spaced-lg">Light Variant</div>
          <div class="demo-row demo-row--p-xl">
            <span class="tooltip">
              <button class="btn btn--outline">Hover me</button>
              <span class="tooltip__content tooltip__content--light">This is a light tooltip with border</span>
            </span>
          </div>
      </section>

      <nav class="docs__pager" aria-label="Previous and next component" data-pager></nav>
    </main>
  </div>

  <script type="module" src="../js/main.js"></script>
  <script type="module" src="../js/components/page.js"></script>
</body>
</html>
