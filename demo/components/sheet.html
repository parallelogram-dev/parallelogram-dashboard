<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sheet - Parallelogram Dashboard</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect fill='%236366f1' x='10' y='20' width='80' height='60' rx='4' transform='skewX(-10)'/></svg>">
  <script>try { if (localStorage.getItem('pd-theme') === 'dark') document.documentElement.setAttribute('data-theme', 'dark'); } catch (e) {}</script>
  <link rel="stylesheet" href="../css/parallelogram-dashboard.css">
  <link rel="stylesheet" href="../css/docs.css">
</head>
<body data-component="sheet">
  <div class="docs">
    <header class="docs__header">
      <a href="../index.html" class="docs__brand">Parallelogram <span class="text--muted">Dashboard</span></a>
      <button type="button" class="btn btn--outline btn--sm" data-theme-toggle>Dark mode</button>
    </header>

    <nav class="docs__nav" aria-label="Components" data-component-nav></nav>

    <main class="docs__main">
      <div class="docs__intro">
        <p class="docs__eyebrow">Overlays</p>
        <h1 class="docs__title">Sheet</h1>
        <p class="docs__lead">Slide-out panels from screen edges.</p>
      </div>

      <section class="docs__section" aria-labelledby="examples-heading">
        <h2 id="examples-heading" class="docs__h2">Examples</h2>
          <div class="demo-box constrain--sm">
            <div class="sheet__panel demo-preview--sheet">
              <div class="sheet__header">
                <div>
                  <h3 class="sheet__title">Edit Profile</h3>
                  <p class="sheet__description">Make changes to your profile settings here.</p>
                </div>
                <button class="sheet__close">
                  <svg class="icon" viewBox="0 0 24 24"><path d="M18 6l-12 12"/><path d="M6 6l12 12"/></svg>
                </button>
              </div>
              <div class="sheet__content demo-preview--overflow-visible">
                <div class="form__group spacer--md">
                  <label class="form__group-label">Name</label>
                  <input type="text" class="input" value="John Doe">
                </div>
                <div class="form__group">
                  <label class="form__group-label">Email</label>
                  <input type="email" class="input" value="john@example.com">
                </div>
              </div>
              <div class="sheet__footer">
                <button class="btn btn--outline">Cancel</button>
                <button class="btn btn--primary">Save Changes</button>
              </div>
            </div>
          </div>

          <p class="text--sm text--muted spacer--md">Sheets can slide in from right, left, top, or bottom. Use <code>.sheet--left</code>, <code>.sheet--top</code>, or <code>.sheet--bottom</code> variants.</p>
      </section>

      <nav class="docs__pager" aria-label="Previous and next component" data-pager></nav>
    </main>
  </div>

  <script type="module" src="../js/main.js"></script>
  <script type="module" src="../js/components/page.js"></script>
</body>
</html>
