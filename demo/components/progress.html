<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Progress - Parallelogram Dashboard</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect fill='%236366f1' x='10' y='20' width='80' height='60' rx='4' transform='skewX(-10)'/></svg>">
  <script>try { var theme = localStorage.getItem('pd-theme'); if (theme === 'dark' || theme === 'light') document.documentElement.setAttribute('data-theme', theme); } catch (e) {}</script>
  <link rel="stylesheet" href="../css/parallelogram-dashboard.css">
  <link rel="stylesheet" href="../css/demo.css">
  <link rel="stylesheet" href="../css/docs.css">
</head>
<body data-component="progress">
  <div class="docs">
    <header class="docs__header">
      <a href="../index.html" class="docs__brand">Parallelogram <span class="text--muted">Dashboard</span></a>
      <button type="button" class="btn btn--outline btn--sm" data-theme-toggle>Dark mode</button>
    </header>

    <nav class="docs__nav" aria-label="Components" data-component-nav></nav>

    <main class="docs__main">
      <div class="docs__intro">
        <p class="docs__eyebrow">Data display</p>
        <h1 class="docs__title">Progress</h1>
        <p class="docs__lead">Progress indicators and loading states.</p>
      </div>

      <section class="docs__section" aria-labelledby="playground-heading">
        <h2 id="playground-heading" class="docs__h2">Playground</h2>
        <div data-playground></div>
      </section>

      <section class="docs__section" aria-labelledby="examples-heading">
        <h2 id="examples-heading" class="docs__h2">Examples</h2>
          <div class="demo-stack demo-stack--lg-gap constrain--sm">
            <div class="progress__labeled">
              <div class="progress__labeled-header">
                <span class="progress__labeled-label">Default</span>
                <span class="progress__labeled-value">60%</span>
              </div>
              <div class="progress" role="progressbar" aria-label="Default" aria-valuenow="60" aria-valuemin="0" aria-valuemax="100">
                <div class="progress__bar progress__bar--60"></div>
              </div>
            </div>

            <div class="progress__labeled">
              <div class="progress__labeled-header">
                <span class="progress__labeled-label">Success</span>
                <span class="progress__labeled-value">100%</span>
              </div>
              <div class="progress progress--success" role="progressbar" aria-label="Success" aria-valuenow="100" aria-valuemin="0" aria-valuemax="100">
                <div class="progress__bar progress__bar--100"></div>
              </div>
            </div>

            <div class="progress__labeled">
              <div class="progress__labeled-header">
                <span class="progress__labeled-label">Warning</span>
                <span class="progress__labeled-value">45%</span>
              </div>
              <div class="progress progress--warning" role="progressbar" aria-label="Warning" aria-valuenow="45" aria-valuemin="0" aria-valuemax="100">
                <div class="progress__bar progress__bar--45"></div>
              </div>
            </div>

            <div class="progress__labeled">
              <div class="progress__labeled-header">
                <span class="progress__labeled-label">Indeterminate</span>
              </div>
              <div class="progress progress--indeterminate" role="progressbar" aria-label="Indeterminate">
                <div class="progress__bar"></div>
              </div>
            </div>
          </div>

          <div class="demo-label spacer--xl">Circle</div>
          <div class="demo-row">
            <div class="progress__circle progress__circle--sm progress__circle--info" role="progressbar" aria-label="Sync" aria-valuenow="40" aria-valuemin="0" aria-valuemax="100">
              <svg class="progress__circle-svg" viewBox="0 0 36 36" aria-hidden="true"><circle class="progress__circle-track" cx="18" cy="18" r="15"/><circle class="progress__circle-bar" cx="18" cy="18" r="15" pathLength="100" stroke-dasharray="100" stroke-dashoffset="60"/></svg>
              <span class="progress__circle-value">40%</span>
            </div>
            <div class="progress__circle progress__circle--lg" role="progressbar" aria-label="Profile complete" aria-valuenow="75" aria-valuemin="0" aria-valuemax="100">
              <svg class="progress__circle-svg" viewBox="0 0 36 36" aria-hidden="true"><circle class="progress__circle-track" cx="18" cy="18" r="15"/><circle class="progress__circle-bar" cx="18" cy="18" r="15" pathLength="100" stroke-dasharray="100" stroke-dashoffset="25"/></svg>
              <span class="progress__circle-value">75%</span>
            </div>
            <div class="progress__circle progress__circle--xs progress__circle--indeterminate" role="progressbar" aria-label="Loading">
              <svg class="progress__circle-svg" viewBox="0 0 36 36" aria-hidden="true"><circle class="progress__circle-track" cx="18" cy="18" r="15"/><circle class="progress__circle-bar" cx="18" cy="18" r="15" pathLength="100" stroke-dasharray="100" stroke-dashoffset="75"/></svg>
            </div>
          </div>

          <div class="demo-label spacer--lg">Steps</div>
          <ol class="steps constrain--sm" aria-label="Checkout progress">
            <li class="steps__item steps__item--completed"><span class="steps__indicator" title="Account">1</span><span class="steps__connector"></span></li>
            <li class="steps__item steps__item--completed"><span class="steps__indicator" title="Profile">2</span><span class="steps__connector"></span></li>
            <li class="steps__item" aria-current="step"><span class="steps__indicator" title="Billing">3</span><span class="steps__connector"></span></li>
            <li class="steps__item"><span class="steps__indicator" title="Confirm">4</span></li>
          </ol>
      </section>

      <nav class="docs__pager" aria-label="Previous and next component" data-pager></nav>
    </main>
  </div>

  <script type="importmap">
  {
    "imports": {
      "@parallelogram-js/dashboard": "../vendor/parallelogram-dashboard/index.js",
      "@parallelogram-js/core/": "../vendor/parallelogram-js/"
    }
  }
  </script>
  <script type="module" src="../js/main.js"></script>
  <script type="module" src="../js/components/page.js"></script>
</body>
</html>
