<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Input - Parallelogram Dashboard</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect fill='%236366f1' x='10' y='20' width='80' height='60' rx='4' transform='skewX(-10)'/></svg>">
  <script>try { var theme = localStorage.getItem('pd-theme'); if (theme === 'dark' || theme === 'light') document.documentElement.setAttribute('data-theme', theme); } catch (e) {}</script>
  <link rel="stylesheet" href="../css/parallelogram-dashboard.css">
  <link rel="stylesheet" href="../css/demo.css">
  <link rel="stylesheet" href="../css/docs.css">
</head>
<body data-component="input">
  <div class="docs">
    <header class="docs__header">
      <a href="../index.html" class="docs__brand">Parallelogram <span class="text--muted">Dashboard</span></a>
      <button type="button" class="btn btn--outline btn--sm" data-theme-toggle>Dark mode</button>
    </header>

    <nav class="docs__nav" aria-label="Components" data-component-nav></nav>

    <main class="docs__main">
      <div class="docs__intro">
        <p class="docs__eyebrow">Forms</p>
        <h1 class="docs__title">Input</h1>
        <p class="docs__lead">Text inputs, textareas, selects, checkboxes, radios and switches.</p>
      </div>

        <section class="docs__section" aria-labelledby="playground-heading">
          <h2 id="playground-heading" class="docs__h2">Playground</h2>
          <div data-playground></div>
        </section>

      <section class="docs__section" aria-labelledby="examples-heading">
        <h2 id="examples-heading" class="docs__h2">Examples</h2>
          <div class="demo-stack demo-stack--lg-gap constrain--sm">
            <div class="form__field">
              <label class="form__label">Email</label>
              <input type="email" class="input form__control" placeholder="Enter your email">
            </div>

            <div class="form__field">
              <label class="form__label">Password</label>
              <input type="password" class="input form__control" placeholder="Enter password">
              <p class="form__description">Must be at least 8 characters.</p>
            </div>

            <div class="form__field">
              <label class="form__label" for="demo-input-error">With Error</label>
              <input type="text" id="demo-input-error" class="input form__control" aria-invalid="true" aria-describedby="demo-input-error-message" value="Invalid input">
              <p class="form__error" id="demo-input-error-message">This field is required.</p>
            </div>

            <div class="form__field">
              <label class="form__label">Disabled</label>
              <input type="text" class="input form__control" disabled value="Cannot edit">
            </div>

            <div class="form__field">
              <label class="form__label">Textarea</label>
              <textarea class="textarea form__control" placeholder="Enter your message..."></textarea>
            </div>

            <div class="form__field">
              <label class="form__label">Select</label>
              <select class="select form__control">
                <option value="">Select an option</option>
                <option value="1">Option 1</option>
                <option value="2">Option 2</option>
                <option value="3">Option 3</option>
              </select>
            </div>

            <div class="demo-row">
              <label class="checkbox">
                <input type="checkbox" class="checkbox__input" checked>
                <span class="checkbox__label">Checkbox</span>
              </label>
              <label class="radio">
                <input type="radio" name="demo-radio" class="radio__input" checked>
                <span class="radio__label">Radio 1</span>
              </label>
              <label class="radio">
                <input type="radio" name="demo-radio" class="radio__input">
                <span class="radio__label">Radio 2</span>
              </label>
            </div>

            <div>
              <label class="switch">
                <input type="checkbox" class="switch__input" checked>
                <span class="switch__label">Toggle switch</span>
              </label>
            </div>
          </div>
      </section>

      <nav class="docs__pager" aria-label="Previous and next component" data-pager></nav>
    </main>
  </div>

  <script type="importmap">
  {
    "imports": {
      "@parallelogram-js/dashboard": "../vendor/parallelogram-dashboard/index.js",
      "@parallelogram-js/core/": "../vendor/parallelogram-js/"
    }
  }
  </script>
  <script type="module" src="../js/main.js"></script>
  <script type="module" src="../js/components/page.js"></script>
</body>
</html>
