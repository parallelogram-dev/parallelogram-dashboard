<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Table - Parallelogram Dashboard</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect fill='%236366f1' x='10' y='20' width='80' height='60' rx='4' transform='skewX(-10)'/></svg>">
  <script>try { var theme = localStorage.getItem('pd-theme'); if (theme === 'dark' || theme === 'light') document.documentElement.setAttribute('data-theme', theme); } catch (e) {}</script>
  <link rel="stylesheet" href="../css/parallelogram-dashboard.css">
  <link rel="stylesheet" href="../css/demo.css">
  <link rel="stylesheet" href="../css/docs.css">
</head>
<body data-component="table">
  <div class="docs">
    <header class="docs__header">
      <a href="../index.html" class="docs__brand">Parallelogram <span class="text--muted">Dashboard</span></a>
      <button type="button" class="btn btn--outline btn--sm" data-theme-toggle>Dark mode</button>
    </header>

    <nav class="docs__nav" aria-label="Components" data-component-nav></nav>

    <main class="docs__main">
      <div class="docs__intro">
        <p class="docs__eyebrow">Data display</p>
        <h1 class="docs__title">Table</h1>
        <p class="docs__lead">Data display in rows and columns.</p>
      </div>

      <section class="docs__section" aria-labelledby="playground-heading">
        <h2 id="playground-heading" class="docs__h2">Playground</h2>
        <div data-playground></div>
      </section>

      <section class="docs__section" aria-labelledby="examples-heading">
        <h2 id="examples-heading" class="docs__h2">Examples</h2>
          <div class="table__wrapper constrain--lg">
            <table class="table table--hoverable">
              <thead class="table__header">
                <tr class="table__row">
                  <th class="table__head">Name</th>
                  <th class="table__head">Email</th>
                  <th class="table__head">Status</th>
                  <th class="table__head table__actions">Actions</th>
                </tr>
              </thead>
              <tbody class="table__body">
                <tr class="table__row">
                  <td class="table__cell">John Doe</td>
                  <td class="table__cell">john@example.com</td>
                  <td class="table__cell"><span class="badge badge--success-muted">Active</span></td>
                  <td class="table__cell table__actions">
                    <button class="btn btn--ghost btn--sm">Edit</button>
                    <button class="btn btn--ghost btn--sm">Delete</button>
                  </td>
                </tr>
                <tr class="table__row">
                  <td class="table__cell">Jane Smith</td>
                  <td class="table__cell">jane@example.com</td>
                  <td class="table__cell"><span class="badge badge--warning-muted">Pending</span></td>
                  <td class="table__cell table__actions">
                    <button class="btn btn--ghost btn--sm">Edit</button>
                    <button class="btn btn--ghost btn--sm">Delete</button>
                  </td>
                </tr>
                <tr class="table__row">
                  <td class="table__cell">Bob Wilson</td>
                  <td class="table__cell">bob@example.com</td>
                  <td class="table__cell"><span class="badge badge--destructive-muted">Inactive</span></td>
                  <td class="table__cell table__actions">
                    <button class="btn btn--ghost btn--sm">Edit</button>
                    <button class="btn btn--ghost btn--sm">Delete</button>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
      </section>

      <nav class="docs__pager" aria-label="Previous and next component" data-pager></nav>
    </main>
  </div>

  <script type="module" src="../js/main.js"></script>
  <script type="module" src="../js/components/page.js"></script>
</body>
</html>
