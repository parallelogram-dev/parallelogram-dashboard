<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Header - Parallelogram Dashboard</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect fill='%236366f1' x='10' y='20' width='80' height='60' rx='4' transform='skewX(-10)'/></svg>">
  <script>try { if (localStorage.getItem('pd-theme') === 'dark') document.documentElement.setAttribute('data-theme', 'dark'); } catch (e) {}</script>
  <link rel="stylesheet" href="../css/parallelogram-dashboard.css">
  <link rel="stylesheet" href="../css/docs.css">
</head>
<body data-component="pageheader">
  <div class="docs">
    <header class="docs__header">
      <a href="../index.html" class="docs__brand">Parallelogram <span class="text--muted">Dashboard</span></a>
      <button type="button" class="btn btn--outline btn--sm" data-theme-toggle>Dark mode</button>
    </header>

    <nav class="docs__nav" aria-label="Components" data-component-nav></nav>

    <main class="docs__main">
      <div class="docs__intro">
        <p class="docs__eyebrow">Navigation &amp; layout</p>
        <h1 class="docs__title">Page Header</h1>
        <p class="docs__lead">Page title with breadcrumb, description and actions.</p>
      </div>

      <section class="docs__section" aria-labelledby="playground-heading">
        <h2 id="playground-heading" class="docs__h2">Playground</h2>
        <div data-playground></div>
      </section>

      <section class="docs__section" aria-labelledby="examples-heading">
        <h2 id="examples-heading" class="docs__h2">Examples</h2>
          <div class="demo-label">Actions on the title row</div>
          <div class="demo-box">
            <div class="pageheader pageheader--row">
              <div class="pageheader__content">
                <nav class="breadcrumb" aria-label="Breadcrumb">
                  <ol class="breadcrumb__list">
                    <li class="breadcrumb__item"><a href="#" class="breadcrumb__link">Records</a></li>
                    <li class="breadcrumb__item" aria-hidden="true"><span class="breadcrumb__separator"><svg class="icon" viewBox="0 0 24 24"><path d="M9 6l6 6l-6 6"/></svg></span></li>
                    <li class="breadcrumb__item"><span class="breadcrumb__page" aria-current="page">Invoice INV-2024-089</span></li>
                  </ol>
                </nav>
                <h2 class="pageheader__title">Invoice INV-2024-089</h2>
                <p class="pageheader__description">Issued 12 January 2024 to Acme Inc.</p>
              </div>
              <div class="pageheader__actions">
                <button type="button" class="btn btn--outline">Download</button>
                <button type="button" class="btn btn--primary">Send</button>
              </div>
            </div>
          </div>
      </section>

      <nav class="docs__pager" aria-label="Previous and next component" data-pager></nav>
    </main>
  </div>

  <script type="module" src="../js/main.js"></script>
  <script type="module" src="../js/components/page.js"></script>
</body>
</html>
