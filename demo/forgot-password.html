<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password - Parallelogram Dashboard</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236366f1' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M16 18a2 2 0 0 1 2 2a2 2 0 0 1 2 -2a2 2 0 0 1 -2 -2a2 2 0 0 1 -2 2zm0 -12a2 2 0 0 1 2 2a2 2 0 0 1 2 -2a2 2 0 0 1 -2 -2a2 2 0 0 1 -2 2zm-7 12a6 6 0 0 1 6 -6a6 6 0 0 1 -6 -6a6 6 0 0 1 -6 6a6 6 0 0 1 6 6z'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/parallelogram-dashboard.css">
  <link rel="stylesheet" href="css/demo.css">
</head>
<body class="bg--muted">

  <div class="auth">
    <div class="auth__container">

      <div class="card">
        <div class="card__content card__content--pt">

          <!-- Request view (default) -->
          <div id="requestForm">
            <div class="auth__header">
              <a href="dashboard.html" class="auth__logo">
                <svg class="icon icon--xl" viewBox="0 0 24 24"><path d="M16 18a2 2 0 0 1 2 2a2 2 0 0 1 2 -2a2 2 0 0 1 -2 -2a2 2 0 0 1 -2 2zm0 -12a2 2 0 0 1 2 2a2 2 0 0 1 2 -2a2 2 0 0 1 -2 -2a2 2 0 0 1 -2 2zm-7 12a6 6 0 0 1 6 -6a6 6 0 0 1 -6 -6a6 6 0 0 1 -6 6a6 6 0 0 1 6 6z"/></svg>
              </a>
              <h1 class="auth__title">Forgot password?</h1>
              <p class="auth__description">No worries, we'll send you reset instructions.</p>
            </div>

            <form class="form" id="forgotForm">

              <div class="form__field">
                <label class="form__label" for="email">Email</label>
                <input type="email" class="input form__control" id="email" placeholder="name@company.com" required>
              </div>

              <button type="submit" class="btn btn--primary btn--full">
                Send reset link
              </button>

            </form>
          </div>

          <!-- Success view (shown after submit) -->
          <div class="text--center" id="successMessage" hidden>
            <div class="auth__icon auth__icon--success">
              <svg class="icon icon--xl" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2 -2h14a2 2 0 0 1 2 2v10a2 2 0 0 1 -2 2h-14a2 2 0 0 1 -2 -2v-10z"/><path d="M3 7l9 6l9 -6"/></svg>
            </div>
            <h2 class="text--lg text--semibold mt--lg">Check your email</h2>
            <p class="text--muted mt--sm">We sent a password reset link to<br><strong id="sentEmail">email@example.com</strong></p>

            <p class="text--sm text--muted mt--lg">
              Didn't receive the email? <a href="#" class="link" onclick="resendEmail()">Click to resend</a>
            </p>
          </div>

          <div class="auth__footer">
            <a href="login.html" class="auth__back">
              <svg class="icon" viewBox="0 0 24 24"><path d="M5 12l14 0"/><path d="M5 12l6 6"/><path d="M5 12l6 -6"/></svg>
              Back to login
            </a>
          </div>

        </div>
      </div>

    </div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "@parallelogram-js/dashboard": "./vendor/parallelogram-dashboard/index.js",
      "@parallelogram-js/core/": "./vendor/parallelogram-js/"
    }
  }
  </script>
  <script type="module" src="js/main.js"></script>
  <script>
    document.getElementById('forgotForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const email = document.getElementById('email').value;
      document.getElementById('sentEmail').textContent = email;
      document.getElementById('requestForm').hidden = true;
      document.getElementById('successMessage').hidden = false;
    });

    function resendEmail() {
      alert('Reset link resent!');
    }
  </script>

</body>
</html>
